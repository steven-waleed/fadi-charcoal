<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer subtle radar circles -->
  <circle cx="256" cy="220" r="160" stroke="rgba(255,255,255,0.15)" stroke-width="8" fill="none" />
  <circle cx="256" cy="220" r="110" stroke="rgba(255,255,255,0.25)" stroke-width="6" fill="none" />
  
  <!-- Main Pin -->
  <g filter="url(#shadow)">
    <path d="M256 90 C184 90 126 148 126 220 C126 310 256 420 256 420 C256 420 386 310 386 220 C386 148 328 90 256 90 Z" fill="#ffffff" />
    <circle cx="256" cy="216" r="46" fill="#2563eb" />
    <!-- Shop / Cart Icon in center -->
    <path d="M242 196 h28 l8 32 h-44 z" fill="#ffffff" />
    <circle cx="244" cy="236" r="5" fill="#ffffff" />
    <circle cx="268" cy="236" r="5" fill="#ffffff" />
  </g>
  
  <!-- Badge text at bottom -->
  <rect x="156" y="440" width="200" height="42" rx="21" fill="rgba(255,255,255,0.2)" />
  <text x="256" y="468" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">المندوب GPS</text>
</svg>
